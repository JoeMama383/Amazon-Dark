name: AmazonDark rootless package

on:
  push:
    branches: [ main, master, stable ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install CSS regression dependencies
        run: python3 -m pip install tinycss2 cssselect2 lxml

      - name: Normalize package script permissions
        run: chmod 755 layout/DEBIAN/postinst

      - name: Validate source regressions
        run: AD_STRICT_VALIDATE=1 sh scripts/validate.sh

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Install patched iOS 16.5 SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone "iPhoneOS16.5.sdk"
          git checkout --quiet
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build rootless package
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean || true
          set +e
          make THEOS_PACKAGE_SCHEME=rootless package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/amazondark-build.log"
          compile_rc=${PIPESTATUS[0]}
          set -e
          if [ "$compile_rc" -ne 0 ]; then
            echo "::group::Actual compiler errors (not trailing ARC warnings)"
            grep -n -C 3 -E '(^|[[:space:]])(fatal )?error:' "$RUNNER_TEMP/amazondark-build.log" | tail -n 170 || true
            echo "::endgroup::"
            exit "$compile_rc"
          fi
          ls -l packages/

      - name: Upload failed compiler log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AmazonDark-compiler-log
          path: ${{ runner.temp }}/amazondark-build.log
          if-no-files-found: ignore

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: AmazonDark-rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Attach .deb to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
