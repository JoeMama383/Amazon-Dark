name: AmazonDark v6.0.0 rootless package

on:
  push:
    branches: [ main, master, stable ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Install patched iOS 16.5 SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone "iPhoneOS16.5.sdk"
          git checkout --quiet
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build rootless package
        run: |
          make clean || true
          make THEOS_PACKAGE_SCHEME=rootless package FINALPACKAGE=1
          ls -l packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazonDark-v6.0.0-rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Attach .deb to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
